    <script>
      // Prevent and suppress benign ResizeObserver loop limit errors
      (function() {
        function isResizeObserverError(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || String(msg));
          return (
            str.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
            str.indexOf('ResizeObserver loop limit exceeded') !== -1
          );
        }

        if (typeof window !== 'undefined' && window.ResizeObserver) {
          var OriginalRO = window.ResizeObserver;
          window.ResizeObserver = class extends OriginalRO {
            constructor(callback) {
              super(function(entries, observer) {
                window.requestAnimationFrame(function() {
                  try {
                    callback(entries, observer);
                  } catch (err) {
                    if (!isResizeObserverError(err)) {
                      throw err;
                    }
                  }
                });
              });
            }
          };
        }

        window.addEventListener('error', function(e) {
          if (isResizeObserverError(e.message) || (e.error && isResizeObserverError(e.error.message))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          if (reason && isResizeObserverError(reason.message || reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>
